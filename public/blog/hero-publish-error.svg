<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Publish success while live stays unchanged">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0E0E"/>
      <stop offset="100%" stop-color="#1A1816"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg2)"/>
  <text x="64" y="72" fill="#8E8E8E" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="0.12em">PUBLISH FAULT</text>
  <text x="64" y="124" fill="#F9F7F4" font-family="Syne, sans-serif" font-size="40" font-weight="800">UI says success. Live did not move.</text>
  <g>
    <rect x="64" y="190" width="260" height="120" rx="16" fill="#0F0E0E" stroke="#312F2F" stroke-width="2"/>
    <text x="194" y="246" text-anchor="middle" fill="#8E8E8E" font-family="IBM Plex Mono, monospace" font-size="14">builder</text>
    <text x="194" y="276" text-anchor="middle" fill="#F9F7F4" font-family="Syne, sans-serif" font-size="22" font-weight="700">edit saved</text>
    <path d="M334 250 H390" stroke="#FF6A00" stroke-width="3" stroke-linecap="round"/>
    <circle cx="404" cy="250" r="8" fill="#FF6A00"/>
    <rect x="424" y="190" width="260" height="120" rx="16" fill="rgba(255,106,0,0.08)" stroke="#FF6A00" stroke-width="2"/>
    <text x="554" y="246" text-anchor="middle" fill="#FF8F5C" font-family="IBM Plex Mono, monospace" font-size="14">publish</text>
    <text x="554" y="276" text-anchor="middle" fill="#FF8F5C" font-family="Syne, sans-serif" font-size="22" font-weight="700">✓ success?</text>
    <path d="M554 320 V360" stroke="#FF6A00" stroke-width="2.5" stroke-dasharray="5 5"/>
    <rect x="200" y="370" width="560" height="100" rx="16" fill="#0F0E0E" stroke="#312F2F" stroke-width="2"/>
    <text x="480" y="420" text-anchor="middle" fill="#F9F7F4" font-family="Syne, sans-serif" font-size="26" font-weight="700">live URL still yesterday</text>
    <text x="480" y="450" text-anchor="middle" fill="#8E8E8E" font-family="IBM Plex Sans, sans-serif" font-size="15">or blank — different faults</text>
  </g>
