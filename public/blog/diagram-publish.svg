<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Three publish failure modes">
  <rect width="640" height="240" rx="16" fill="#1A1816"/>
  <g font-family="Syne, sans-serif" font-weight="700" font-size="16">
    <rect x="20" y="28" width="180" height="184" rx="14" fill="#0F0E0E" stroke="#312F2F" stroke-width="2"/>
    <text x="110" y="80" text-anchor="middle" fill="#FF8F5C">Build failed</text>
    <text x="110" y="120" text-anchor="middle" fill="#8E8E8E" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="400">Read the log.</text>
    <text x="110" y="144" text-anchor="middle" fill="#8E8E8E" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="400">Fix before retry.</text>
    <rect x="230" y="28" width="180" height="184" rx="14" fill="#0F0E0E" stroke="#FF6A00" stroke-width="2"/>
    <text x="320" y="80" text-anchor="middle" fill="#FF8F5C">Stale live</text>
    <text x="320" y="120" text-anchor="middle" fill="#8E8E8E" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="400">Cache / wrong</text>
    <text x="320" y="144" text-anchor="middle" fill="#8E8E8E" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="400">target / preview</text>
    <rect x="440" y="28" width="180" height="184" rx="14" fill="#0F0E0E" stroke="#312F2F" stroke-width="2"/>
    <text x="530" y="80" text-anchor="middle" fill="#FF8F5C">Blank screen</text>
    <text x="530" y="120" text-anchor="middle" fill="#8E8E8E" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="400">Last AI edit +</text>
    <text x="530" y="144" text-anchor="middle" fill="#8E8E8E" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="400">console error</text>
  </g>
</svg>
