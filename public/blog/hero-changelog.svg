<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Reading official Base44 updates as a builder">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0E0E"/>
      <stop offset="100%" stop-color="#1A1816"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg4)"/>
  <circle cx="880" cy="420" r="140" fill="#FF6A00" opacity="0.07"/>
  <text x="64" y="72" fill="#8E8E8E" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="0.12em">BUILDER HABIT</text>
  <text x="64" y="124" fill="#F9F7F4" font-family="Syne, sans-serif" font-size="40" font-weight="800">Read what Base44 actually shipped.</text>
  <g>
    <rect x="64" y="190" width="380" height="240" rx="18" fill="#0F0E0E" stroke="#FF6A00" stroke-width="2"/>
    <text x="96" y="240" fill="#FF8F5C" font-family="IBM Plex Mono, monospace" font-size="13">PRODUCT</text>
    <text x="96" y="280" fill="#F9F7F4" font-family="Syne, sans-serif" font-size="24" font-weight="700">Features &amp; UI</text>
    <text x="96" y="320" fill="#8E8E8E" font-family="IBM Plex Sans, sans-serif" font-size="15">What changed for builders</text>
    <text x="96" y="348" fill="#8E8E8E" font-family="IBM Plex Sans, sans-serif" font-size="15">in the product surface.</text>
    <text x="96" y="390" fill="#FF6A00" font-family="IBM Plex Mono, monospace" font-size="13">docs → changelog → product</text>
    <rect x="480" y="190" width="416" height="240" rx="18" fill="#0F0E0E" stroke="#312F2F" stroke-width="2"/>
    <text x="512" y="240" fill="#8E8E8E" font-family="IBM Plex Mono, monospace" font-size="13">DEVELOPER</text>
    <text x="512" y="280" fill="#F9F7F4" font-family="Syne, sans-serif" font-size="24" font-weight="700">CLI &amp; APIs</text>
    <text x="512" y="320" fill="#8E8E8E" font-family="IBM Plex Sans, sans-serif" font-size="15">Branch, SDK, and tooling notes</text>
    <text x="512" y="348" fill="#8E8E8E" font-family="IBM Plex Sans, sans-serif" font-size="15">when the builder UI is not enough.</text>
    <text x="512" y="390" fill="#8E8E8E" font-family="IBM Plex Mono, monospace" font-size="13">docs → changelog → developers</text>
  </g>
</svg>
