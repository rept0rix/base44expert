<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" role="img" aria-label="Molten mark">
  <defs>
    <linearGradient id="molten" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFB088"/>
      <stop offset="35%" stop-color="#FF8F5C"/>
      <stop offset="70%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#C44A00"/>
    </linearGradient>
    <filter id="lava" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.08" numOctaves="3" seed="7" result="noise">
        <animate attributeName="baseFrequency" values="0.035 0.08;0.05 0.12;0.028 0.07;0.035 0.08" dur="4s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Abstract molten blob — not Base44 Inc trademark -->
